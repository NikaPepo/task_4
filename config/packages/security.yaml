security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # IMPORTANT: loads users by e-mail, which is what the login form posts.
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # NOTE: dev tools / static assets bypass auth.
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # IMPORTANT: enforce "blocked users cannot log in" at the firewall level.
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                # IMPORTANT: explicit redirect target after successful login.
                # NOTE: without this Symfony falls back to "/", which shows
                # the welcome page rather than the user-management table.
                default_target_path: app_users
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: app_login

    # IMPORTANT: only authenticated users reach the user-management routes.
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/registration, roles: PUBLIC_ACCESS }
        - { path: ^/verify, roles: PUBLIC_ACCESS }
        - { path: ^/users, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10