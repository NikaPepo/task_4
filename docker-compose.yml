services:
  app:
    user: "1000:1000"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - '.:/var/www'
    networks:
      - app
    depends_on:
      - mysql
  nginx:
    image: nginx:alpine
    ports:
      - '${APP_PORT}:80'
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    networks:
      - app
  # IMPORTANT: replaces the old `worker` service (long-running
  # `messenger:consume` process). Symfony 8.1 Scheduler dispatches
  # ConsumeMessengerMessage every minute via Messenger; this loop
  # just runs `messenger:consume async` for up to 50s/20 messages,
  # then sleeps 5s. No permanent worker — just short subprocesses.
  scheduler:
    user: "1000:1000"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: sh -c "while true; do php bin/console messenger:consume async --time-limit=50 --limit=20 --memory-limit=128M; sleep 5; done"
    volumes:
      - '.:/var/www'
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3320}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'mysql:/var/lib/mysql'
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
networks:
  app:
    driver: bridge
volumes:
  mysql:
    driver: local
