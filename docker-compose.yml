services:
  app:
    user: "1000:1000"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - '.:/var/www'
    networks:
      - app
    depends_on:
      - mysql
  nginx:
    image: nginx:alpine
    ports:
      - '${APP_PORT}:80'
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    networks:
      - app
  worker:
    user: "1000:1000"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php /var/www/bin/console messenger:consume async failed -vv --time-limit=3600
    volumes:
      - '.:/var/www'
    networks:
      - app
    # NOTE: wait for MySQL healthcheck to pass before starting the worker,
    # otherwise the very first PDO connect races the database initialisation
    # and crashes with "SQLSTATE[HY000] [2002] Connection refused".
    # restart: unless-stopped also brings the container back if a transport
    # error ever kills the consume command.
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3320}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'mysql:/var/lib/mysql'
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
networks:
  app:
    driver: bridge
volumes:
  mysql:
    driver: local
