# IMPORTANT: NO worker, NO scheduler service in this file.
# Async email is drained by a real cron job (not a long-running
# process) — the host's crontab calls `docker compose exec` once a
# minute to run messenger:consume as a short-lived subprocess.
# On Linux host:
#   crontab -e
#   * * * * * cd /path/to/task_4 && docker compose exec -T app \
#     php bin/console messenger:consume async --time-limit=50 --limit=20 \
#     >> /var/log/messenger.log 2>&1

services:
  app:
    user: "1000:1000"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - '.:/var/www'
    networks:
      - app
    depends_on:
      - mysql
  nginx:
    image: nginx:alpine
    ports:
      - '${APP_PORT}:80'
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    networks:
      - app
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3320}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'mysql:/var/lib/mysql'
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
networks:
  app:
    driver: bridge
volumes:
  mysql:
    driver: local
