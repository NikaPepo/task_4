# IMPORTANT: Render.com Blueprint for the Symfony app.
# Apply via Render Dashboard → New → Blueprint → pick the repo. Once applied,
# pushes to main auto-deploy, and PRs get preview environments.

databases:
  - name: task-4-db
    databaseName: symfony
    user: app
    plan: free
    ipAllowList: [] # only Render services can connect

services:
  # ──────────────────────────────────────────────────────────────────────────
  # HTTP web service (PHP-FPM behind Render's nginx)
  # ──────────────────────────────────────────────────────────────────────────
  - type: pserv
    name: task-4-web
    runtime: php
    plan: free
    rootDir: public                  # nginx docroot = Symfony public/
    # NOTE: --no-dev excludes phpunit/debug-bundle/etc. APP_ENV=prod is
    # picked up by composer auto-scripts (cache:clear, assets:install).
    buildCommand: "composer install --no-dev --optimize-autoloader"
    # NOTE: preDeployCommand runs against the OLD code, but doctrine
    # migrations are written to be backwards-compatible, so this is OK.
    preDeployCommand: "php bin/console doctrine:migrations:migrate --no-interaction --env=prod && php bin/console messenger:setup-transports --env=prod"
    healthCheckPath: /login
    previewPlan: free               # enables PR Preview environments
    autoDeploy: true
    envVars:
      - key: PHP_VERSION
        value: "8.4"
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true          # Render generates & stores this once
      - key: DATABASE_URL
        fromDatabase:
          name: task-4-db
          property: connectionString
      # IMPORTANT: APP_BASE_URL must point at the deployed URL so the
      # verification link in emails resolves to the live site (Render
      # injects hostUrl like "https://task-4-web.onrender.com").
      - key: APP_BASE_URL
        fromService:
          type: pserv
          name: task-4-web
          property: hostUrl
      - key: MAILER_FROM_EMAIL
        # Render will prompt for this when applying the Blueprint.
        # It MUST be a verified sender in your Brevo account
        # (https://app.brevo.com/settings/senders).
        sync: false
      - key: MAILER_FROM_NAME
        value: User Management
      # IMPORTANT: MAILER_DSN contains your Brevo API key — never
      # commit it. Render prompts for it once when the Blueprint is
      # applied and stores it in the service's secret store; subsequent
      # git-push deploys keep the existing value.
      # Format: brevo+api://<BREVO_API_KEY>@default
      - key: MAILER_DSN
        sync: false

  # ──────────────────────────────────────────────────────────────────────────
  # Cron job — drains the messenger queue every minute. Each invocation
  # starts, runs messenger:consume for up to 50s (limit 20 messages), then
  # exits. Render's cron handles the next-minute schedule.
  #
  # NOTE: this is the primary consumer in production. The HTTP endpoint
  # POST /messenger/consume (MessengerConsumeController) is a fallback for
  # external cron services (cron-job.org, UptimeRobot, GitHub Actions) and
  # is gated by the X-Cron-Token header.
  # ──────────────────────────────────────────────────────────────────────────
  - type: cron
    name: task-4-consume
    runtime: php
    plan: free
    schedule: "* * * * *"           # every minute
    buildCommand: "composer install --no-dev --optimize-autoloader"
    startCommand: "php bin/console messenger:consume async --time-limit=50 --limit=20 --memory-limit=128M -v"
    autoDeploy: true
    envVars:
      - key: PHP_VERSION
        value: "8.4"
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        fromService:
          type: pserv
          name: task-4-web
          property: APP_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: task-4-db
          property: connectionString
      - key: APP_BASE_URL
        fromService:
          type: pserv
          name: task-4-web
          property: APP_BASE_URL
      - key: MAILER_DSN
        fromService:
          type: pserv
          name: task-4-web
          property: MAILER_DSN
      - key: MAILER_FROM_EMAIL
        fromService:
          type: pserv
          name: task-4-web
          property: MAILER_FROM_EMAIL